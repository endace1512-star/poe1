name: Release

# Push a tag like v0.1.0 to publish poe1.exe as a GitHub release,
# or run manually to get the exe as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Test
        run: dotnet test
      - name: Publish single-file exe
        run: >
          dotnet publish src/Poe1.Server -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: poe1-win-x64
          path: publish/poe1.exe
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/poe1.exe
